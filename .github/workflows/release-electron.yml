name: Release Electron

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            build_args: "--mac dmg zip"
            needs_icon: true
          - name: Windows
            os: windows-latest
            build_args: "--win nsis"
            needs_icon: false
          - name: Linux
            os: ubuntu-latest
            build_args: "--linux AppImage"
            needs_icon: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build renderer
        run: npm --prefix frontend run build

      - name: Generate macOS icon
        if: matrix.platform.needs_icon
        run: npm --prefix frontend run electron:icon:mac

      - name: Publish release assets
        run: npx electron-builder ${{ matrix.platform.build_args }} --publish always
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
